<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:xmnls="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>Listado de estudiantes</title>
</head>
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
<body>
    <nav class="navbar navbar-expand-md bg-dark navbar-dark">
        <a class="navbar-brand" href="#">Control de estudiantes</a>
        <!-- Navbar links -->
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link"
                                        th:href="@{/estudiantes}">Control de estudiantes</a></li>
            </ul>

        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <a th:href="@{/student/new}" class="btn btn-primary btn-sm mb-3">Agregar estudiante</a>
            </div>
        </div>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Surname</th>
                    <th>Email</th>
                    <th>Password</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.surname}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.age}"></td>
                </tr>
            </tbody>
        </table>
    </div>


</body>
</html>
