<div class="col-md-6 offset-md-3 mt-4">
  <h3 class="text-center mb-4">My Profile</h3>

  <div *ngIf="student" class="card">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Student Data</h4>
    </div>
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-sm-4 fw-bold">ID:</div>
        <div class="col-sm-8">{{ student.id }}</div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-4 fw-bold">Name:</div>
        <div class="col-sm-8">{{ student.name }}</div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-4 fw-bold">Surnames:</div>
        <div class="col-sm-8">{{ student.surname }}</div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-4 fw-bold">Email:</div>
        <div class="col-sm-8">{{ student.email }}</div>
      </div>
      <div class="row mb-3">
        <div class="col-sm-4 fw-bold">Age:</div>
        <div class="col-sm-8">{{ student.age }}</div>
      </div>

      <div class="d-flex justify-content-between mt-4 align-items-center">
        <button class="btn btn-secondary" (click)="goToList()">Go back to Plan list</button>

        <div class="d-flex" style="gap: 10px;">
          <button class="btn btn-danger" (click)="deleteMyProfile()">Delete Account</button>
          <button class="btn btn-primary" (click)="goToUpdate()">Edit my profile</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!student" class="alert alert-warning text-center">
    Charging profile data...
  </div>
</div>
